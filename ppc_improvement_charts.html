<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPC 개선 생산성 비교</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; padding: 32px 24px; }
  h1 { font-size: 18px; font-weight: 600; color: #111; margin-bottom: 28px; }
  .chart-section { margin-bottom: 40px; }
  .chart-title { font-size: 15px; font-weight: 600; color: #222; margin-bottom: 10px; }
  .chart-wrapper { background: #fff; border-radius: 10px; border: 1px solid #e0e0e0; padding: 16px 16px 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .legend { display: flex; gap: 20px; margin-bottom: 12px; font-size: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; color: #444; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .chart-canvas-wrap { position: relative; width: 100%; height: 300px; }
</style>
</head>
<body>
<h1>개선 PPC vs 개선 외 PPC — 생산성 비교</h1>

<div class="chart-section">
  <div class="chart-title">1차 개선 — 26~36week</div>
  <div class="chart-wrapper">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#c0453a;"></div>개선 외 PPC</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1a8a7a;"></div>개선 PPC (1차)</div>
    </div>
    <div class="chart-canvas-wrap"><canvas id="chart1"></canvas></div>
  </div>
</div>

<div class="chart-section">
  <div class="chart-title">2차 개선 — 34~44week</div>
  <div class="chart-wrapper">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#c0453a;"></div>개선 외 PPC</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1a8a7a;"></div>개선 PPC (2차)</div>
    </div>
    <div class="chart-canvas-wrap"><canvas id="chart2"></canvas></div>
  </div>
</div>

<div class="chart-section">
  <div class="chart-title">3차 개선 — 4~14week</div>
  <div class="chart-wrapper">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#c0453a;"></div>개선 외 PPC</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1a8a7a;"></div>개선 PPC (3차)</div>
    </div>
    <div class="chart-canvas-wrap"><canvas id="chart3"></canvas></div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

const MINT = '#1a8a7a';
const RED = '#c0453a';
const BLUE = '#2a72c8';
const GAP_FILL = 'rgba(180,110,80,0.22)';
const GAP_INDICES = [0, 5, 10];

function calcGap(other, improve) {
  return (improve - other) / other * 100;
}

const gapLabelPlugin = {
  id: 'gapLabelPlugin',
  afterDraw(chart) {
    const { ctx, chartArea, scales, data } = chart;
    const otherData = data.datasets[0].data;
    const improveData = data.datasets[1].data;
    const xScale = scales.x;
    const TOP_Y = chartArea.top - 38;

    GAP_INDICES.forEach((idx) => {
      const v = calcGap(otherData[idx], improveData[idx]);
      const isPos = v >= 0;
      const color = isPos ? BLUE : RED;
      const abs = Math.abs(v).toFixed(1);
      const valStr = isPos ? `+${abs}%` : `▼${abs}%`;
      const xCenter = xScale.getPixelForValue(idx);
      const boxW = 58, boxH = 40, radius = 4;
      let boxX = xCenter - boxW / 2;
      if (idx === 0) boxX = xCenter - 4;
      if (idx === GAP_INDICES[GAP_INDICES.length - 1]) boxX = xCenter - boxW + 4;

      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.strokeStyle = 'rgba(0,0,0,0.10)';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.roundRect(boxX, TOP_Y, boxW, boxH, radius);
      ctx.fill();
      ctx.stroke();

      const textX = boxX + boxW / 2;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#999';
      ctx.font = '11px sans-serif';
      ctx.fillText('GAP', textX, TOP_Y + 14);
      ctx.fillStyle = color;
      ctx.font = '700 15px sans-serif';
      ctx.fillText(valStr, textX, TOP_Y + 32);
      ctx.restore();
    });
  }
};

function buildChart(id, labels, otherData, improveData, improvePeriodStart, improvePeriodEnd) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const allVals = [...otherData, ...improveData];
  const yMin = Math.floor((Math.min(...allVals) - 0.5) / 2) * 2;
  const yMax = Math.ceil((Math.max(...allVals) + 0.5) / 2) * 2;

  new Chart(canvas, {
    type: 'line',
    plugins: [gapLabelPlugin],
    data: {
      labels,
      datasets: [
        {
          label: '개선 외 PPC',
          data: otherData,
          borderColor: RED,
          backgroundColor: 'rgba(192,69,58,0.08)',
          borderWidth: 2.5,
          pointRadius: 5,
          pointBackgroundColor: '#fff',
          pointBorderColor: RED,
          pointBorderWidth: 2.5,
          fill: { target: 1, above: GAP_FILL },
          tension: 0.3,
          order: 1,
          datalabels: { align: 'top', anchor: 'end', offset: 2, color: RED, font: { size: 14, weight: '600' }, formatter: v => v.toFixed(1) }
        },
        {
          label: '개선 PPC',
          data: improveData,
          borderColor: MINT,
          backgroundColor: 'rgba(26,138,122,0.08)',
          borderWidth: 2.5,
          pointRadius: 5,
          pointBackgroundColor: '#fff',
          pointBorderColor: MINT,
          pointBorderWidth: 2.5,
          fill: false,
          tension: 0.3,
          order: 0,
          datalabels: { align: 'bottom', anchor: 'end', offset: 2, color: MINT, font: { size: 14, weight: '600' }, formatter: v => v.toFixed(1) }
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: { padding: { top: 52, bottom: 4, left: 4, right: 50 } },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#fff', titleColor: '#555', bodyColor: '#222', borderColor: '#ddd', borderWidth: 1,
          callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}` }
        },
        annotation: {
          clip: false,
          annotations: {
            improveBox: {
              type: 'box',
              xMin: improvePeriodStart - 0.5,
              xMax: improvePeriodEnd + 0.5,
              backgroundColor: 'rgba(26,138,122,0.07)',
              borderColor: 'rgba(26,138,122,0.25)',
              borderWidth: 1,
              label: { display: true, content: '개선 진행', position: { x: 'center', y: 'start' }, color: '#1a8a7a', font: { size: 11 }, yAdjust: 6 }
            }
          }
        },
        datalabels: {}
      },
      scales: {
        x: { ticks: { display: false }, grid: { color: 'rgba(0,0,0,0.05)' }, border: { color: '#ccc' } },
        y: { min: yMin, max: yMax, ticks: { color: '#888', font: { size: 11 }, stepSize: 2 }, grid: { color: 'rgba(0,0,0,0.06)' }, border: { color: '#ccc' } }
      }
    }
  });
}

buildChart('chart1',
  ['26w','27w','28w','29w','30w','31w','32w','33w','34w','35w','36w'],
  [12.89,13.33,12.90,13.43,13.25,13.68,13.29,13.47,13.70,13.69,13.47],
  [10.81,11.70,11.42,11.35,11.45,12.37,12.10,12.70,12.90,13.25,13.61], 3, 6);

buildChart('chart2',
  ['34w','35w','36w','37w','38w','39w','40w','41w','42w','43w','44w'],
  [13.71,13.72,13.60,13.53,14.02,13.81,14.20,14.41,14.31,14.47,14.70],
  [12.77,12.86,12.23,12.12,12.41,12.74,13.38,13.92,13.95,14.31,14.77], 3, 6);

buildChart('chart3',
  ['4w','5w','6w','7w','8w','9w','10w','11w','12w','13w','14w'],
  [13.96,14.40,14.20,14.86,15.31,15.58,15.64,15.69,15.13,15.42,15.84],
  [12.71,13.22,12.63,13.43,14.10,14.32,14.37,14.87,14.31,14.53,15.92], 3, 6);
</script>
</body>
</html>
